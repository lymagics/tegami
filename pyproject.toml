[project]
name = "tegami"
dynamic = ["version"]
description = "A small object-oriented Python library for sending email."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.3",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "plum-dispatch>=2.10.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "pytest-fail-slow==0.6.0",
    "pytest-repeat==0.9.4",
    "PyHamcrest==2.1.0",
    "aiosmtpd==1.4.6",
    "hypothesis==6.168.0",
    "black==26.5.1",
    "flake8==7.4.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["tegami"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p randomly --fail-slow=5s -m 'not online' --cov=tegami --cov-fail-under=90"
markers = [
    "online: tests that need internet access and real providers",
]
filterwarnings = [
    "ignore:Requiring AUTH while not requiring TLS:UserWarning",
]

[tool.coverage.report]
exclude_also = ["@abstractmethod"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
# F811: plum-dispatch constructor overloads redefine __init__ by design.
# TRY002: the project raises only the built-in Exception (see specs/design.md).
ignore = ["F811", "TRY002"]

[tool.black]
line-length = 88
target-version = ["py311"]
